
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Compound Interest Calculator</title>
</head>

<body>

<h2>複利計算程式</h2>

<form onsubmit="calculateCompoundInterest(event)">

    <div>
        <label for="principal">本金：</label>
        <input type="number"
               id="principal"
               min="1000"
               max="100000"
               step="1000"
               value="10000"
               required>
    </div>

    <div>
        <label for="year">年數：</label>
        <input type="number"
               id="year"
               min="1"
               max="20"
               step="1"
               value="1"
               required>
    </div>

    <div>
        <label for="rate">年利率 (%)：</label>
        <input type="number"
               id="rate"
               min="0.01"
               max="100"
               step="0.01"
               value="2.0"
               required>
    </div>

    <div>
        <label for="amount">本利和：</label>
        <input type="text"
               id="amount"
               readonly>
    </div>

    <button type="submit">Submit</button>

</form>

<script>

    function calculateCompoundInterest(event) {

//        event.preventDefault();

        // Code 2: Obtain principal
        let principal =
            document.getElementById("principal").value;

        // Code 3: Obtain year
        let year =
            document.getElementById("year").value;

        // Code 4: Obtain interest rate
        let rate =
            document.getElementById("rate").value;

        // Code 5: Calculate compound interest
        let amount =
            principal * Math.pow(1 + rate / 100, year);

        // Code 6: Display the result
        document.getElementById("amount").value =
            amount.toFixed(2);

    }

</script>

</body>
</html>
