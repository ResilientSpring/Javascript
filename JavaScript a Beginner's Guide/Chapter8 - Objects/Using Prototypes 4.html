<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Using Prototypes 4</title>
</head>
<body>

<script>

    function Car(seats, engine, radio) {
        this.seats = seats;
        this.engine = engine;
        this.radio = radio;
    }

    Car.prototype.locks = "automatic";

    let work_car = new Car("cloth", "V-6", "Tape Deck");
    let family_car = new Car("family", "V-4", "CD Changer");

    work_car.locks = "manual";

    window.alert(work_car.locks);
    window.alert(family_car.locks);

</script>


</body>
</html>
