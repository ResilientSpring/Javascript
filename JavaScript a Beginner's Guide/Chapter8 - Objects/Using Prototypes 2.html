<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Using Prototypes</title>
</head>
<body>

<script>

    function Car(seats, engine, radio) {

        this.seats = seats;
        this.engine = engine;
        this.radio = radio;

    }

    // Since the prototype is an object itself, you can add a property to the prototype
    // as you could with any other object.
    Car.prototype.locks = "automatic";

</script>


</body>
</html>
