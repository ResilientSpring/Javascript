<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Nested functions</title>
</head>
<body>

<script>

    function makeAdder(x) {

        return function (y){

            return x + y;

        }

    }

    const add5 = makeAdder(5);

    console.log(add5(3));

</script>


</body>
</html>
