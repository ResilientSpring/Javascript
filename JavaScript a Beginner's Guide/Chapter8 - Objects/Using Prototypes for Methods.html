<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Using Prototypes for Methods</title>
</head>
<body>

<script>

    function Car(seats, engine, radio) {

        this.seats = seats;
        this.engine = engine;
        this.radio = radio;

    }

    Car.prototype.describe = function () {
        document.write("This amazing car has these features: ");
        document.write(this.seats + " seats, " + this.engine + " engine, ");
    }



</script>


</body>
</html>
