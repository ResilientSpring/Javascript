<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Property Values 7</title>
</head>
<body>

<script>

    function Car(seats, engine, radio){

        this.position = seats;

        this.enable = engine;

        this.wireless = radio;

    }

    let jam = new Car("cloth", "V-6", 98.3);

    window.alert(jam.position);

    document.writeln(jam.wireless);

    console.log(jam.enable);

</script>


</body>
